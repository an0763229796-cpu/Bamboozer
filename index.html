    <script>
      /* Ensure window.fetch has a setter so sandboxed iframe environments or polyfills do not throw:
         "Cannot set property fetch of #<Window> which has only a getter" */
      (function() {
        try {
          var targetObj = window;
          var desc = Object.getOwnPropertyDescriptor(targetObj, 'fetch');
          if (!desc) {
            var proto = Object.getPrototypeOf(targetObj);
            desc = proto ? Object.getOwnPropertyDescriptor(proto, 'fetch') : null;
          }
          var currentFetch = window.fetch ? window.fetch.bind(window) : null;
          if (currentFetch && (!desc || !desc.set)) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (_) {}

        /* Global error handler suppressing cross-origin / third-party iframe errors */
        window.addEventListener('error', function(event) {
          if (!event) return;
          var msg = (event.message || '') + '';
          var filename = (event.filename || '') + '';
          if (
            msg.indexOf('Cannot set property fetch') !== -1 ||
            msg.indexOf('property fetch of #<Window>') !== -1 ||
            msg.indexOf('Tawk') !== -1 ||
            msg.indexOf('tawk') !== -1 ||
            filename.indexOf('tawk.to') !== -1 ||
            filename.indexOf('tawk.link') !== -1
          ) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          var reasonStr = (event.reason ? (event.reason.message || String(event.reason)) : '') + '';
          if (reasonStr.indexOf('Tawk') !== -1 || reasonStr.indexOf('tawk') !== -1) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
